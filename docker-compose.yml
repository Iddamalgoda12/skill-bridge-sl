version: "3.9"

services:

  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: skillbridgesl-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillbridgesl}
      POSTGRES_USER: ${POSTGRES_USER:-skillbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillbridge} -d ${POSTGRES_DB:-skillbridgesl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skillbridge-net

  # ─── Spring Boot Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: .                        # Root context – needed to COPY database/migrations/
      dockerfile: backend/Dockerfile
    container_name: skillbridgesl-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-skillbridgesl}
      DB_USERNAME: ${POSTGRES_USER:-skillbridge}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-skillbridge_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_minimum_256_bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Migrations are COPYed into the image at /app/migrations by the Dockerfile
      FLYWAY_LOCATIONS: filesystem:/app/migrations
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - skillbridge-net

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillbridgesl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    networks:
      - skillbridge-net

volumes:
  postgres_data:
    driver: local

networks:
  skillbridge-net:
    driver: bridge

