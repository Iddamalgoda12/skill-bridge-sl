# ──────────────────────────────────────────────────────────────────────────────
# Local development profile overrides
# ──────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skillbridgesl
    username: skillbridge
    password: skillbridge_secret

  # ─── Flyway: point to the shared database/migrations/ folder ──────────────
  # Working directory when running `mvn spring-boot:run` is backend/,
  # so ../database/migrations resolves to the root database/migrations/ folder.
  flyway:
    locations: filesystem:../database/migrations

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.skillbridgesl: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoint:
    health:
      show-details: always

