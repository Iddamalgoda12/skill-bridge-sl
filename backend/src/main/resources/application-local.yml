# ──────────────────────────────────────────────────────────────────────────────
# Local development profile overrides
# ──────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbridgesl}
    username: ${DB_USERNAME:skillbridge}
    password: ${DB_PASSWORD:skillbridge_secret}

  # ─── Flyway: point to the shared database/migrations/ folder ──────────────
  # Working directory when running `mvn spring-boot:run` is backend/,
  # so ../database/migrations resolves to the root database/migrations/ folder.
  flyway:
    locations: filesystem:../database/migrations

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    com.skillbridgesl: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

app:
  security:
    # Locally the API is only reached through the Next.js BFF, which forwards the visitor's address.
    trust-forwarded-for: true
  jwt:
    # Development-only key. Never reuse outside the local profile.
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktand0LXNlY3JldC1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZQ==}

