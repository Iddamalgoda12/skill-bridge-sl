# ──────────────────────────────────────────────────────────────────────────────
# SkillBridgeSL – Base application configuration
# Profile-specific files (application-local.yml, application-prod.yml) override
# ──────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: skillbridgesl-backend

  # ─── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skillbridgesl}
    username: ${DB_USERNAME:skillbridge}
    password: ${DB_PASSWORD:skillbridge_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: SkillBridgeHikariPool

  # ─── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate          # Flyway owns schema – never use create/update
    open-in-view: false           # Avoid lazy-loading anti-pattern
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ─── Flyway (DB Migrations) ────────────────────────────────────────────────
  # Migrations live in database/migrations/ (outside the JAR).
  # Local development reads the shared migrations folder via application-local.yml.
  # Set FLYWAY_LOCATIONS when deploying to a different environment.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: ${FLYWAY_LOCATIONS:filesystem:/app/migrations}
    schemas: public
    validate-on-migrate: true
    out-of-order: false

  # ─── Jackson (JSON) ────────────────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

  # ─── Mail (configure SMTP in profile-specific yml) ─────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ─── Server ────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

# ─── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

# ─── App Custom Properties ─────────────────────────────────────────────────
app:
  jwt:
    # Required (base64, >= 32 bytes). No default outside the local profile:
    #   openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}                     # access token: 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token: 7 days
  security:
    # Only enable when the API is reachable solely through a trusted proxy.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    auth-rate-limit: ${AUTH_RATE_LIMIT:30}                         # per client, per endpoint, per 15 min
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  pagination:
    default-page-size: 20
    max-page-size: 100

# ─── SpringDoc / Swagger UI ────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: SkillBridgeSL API
    version: v1
    description: REST API for the SkillBridgeSL platform

