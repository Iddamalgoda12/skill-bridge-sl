# ──────────────────────────────────────────────────────────────────────────────
# Production profile overrides
# All secrets must come from environment variables – never hardcode here!
# ──────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false

logging:
  level:
    com.skillbridgesl: INFO
    org.springframework: WARN
    org.hibernate: WARN

server:
  ssl:
    enabled: ${SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

